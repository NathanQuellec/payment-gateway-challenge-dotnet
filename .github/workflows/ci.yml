name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    name: API and bank simulator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start application stack
        run: docker compose up -d --build --wait --wait-timeout 180 api
      - name: Wait for API readiness
        run: curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://localhost:15000/health/ready
      - name: Exercise real bank contract
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Show container diagnostics
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop application stack
        if: always()
        run: docker compose down

  build-and-test:
    name: Audit, build and test (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Restore once and fail on vulnerabilities of any severity or unavailable audit data.
      - name: Restore and audit dependencies
        run: >-
          dotnet restore PaymentGateway.sln --force --no-cache
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          -p:TreatWarningsAsErrors=true

      - name: Build with compiler, analyzer and code style warnings as errors
        run: >-
          dotnet build PaymentGateway.sln
          --configuration Release --no-restore
          -warnaserror
          -p:EnableNETAnalyzers=true
          -p:AnalysisLevel=8.0
          -p:EnforceCodeStyleInBuild=true

      - name: Test
        run: >-
          dotnet test PaymentGateway.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
