name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Audit, build and test (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      MINIMUM_LINE_COVERAGE: '80'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Restore once and fail on vulnerabilities of any severity or unavailable audit data.
      - name: Restore and audit dependencies
        run: >-
          dotnet restore PaymentGateway.sln --force --no-cache
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          -p:TreatWarningsAsErrors=true

      - name: Build with compiler, analyzer and code style warnings as errors
        run: >-
          dotnet build PaymentGateway.sln
          --configuration Release --no-restore
          -warnaserror
          -p:EnableNETAnalyzers=true
          -p:AnalysisLevel=8.0
          -p:EnforceCodeStyleInBuild=true

      - name: Test
        run: >-
          dotnet test PaymentGateway.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Enforce minimum line coverage
        shell: pwsh
        run: |
          $reports = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml
          if (-not $reports) {
            throw 'No Cobertura coverage reports were produced.'
          }

          $linesCovered = 0
          $linesValid = 0
          foreach ($report in $reports) {
            [xml]$coverage = Get-Content $report.FullName
            $linesCovered += [int]$coverage.coverage.'lines-covered'
            $linesValid += [int]$coverage.coverage.'lines-valid'
          }

          if ($linesValid -eq 0) {
            throw 'Coverage reports do not contain any valid lines.'
          }

          $percentage = 100 * $linesCovered / $linesValid
          Write-Host ('Line coverage: {0:N2}% ({1}/{2})' -f $percentage, $linesCovered, $linesValid)

          if ($percentage -lt [double]$env:MINIMUM_LINE_COVERAGE) {
            throw ('Line coverage {0:N2}% is below the required {1}.' -f $percentage, $env:MINIMUM_LINE_COVERAGE)
          }

      - name: Upload test results and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
